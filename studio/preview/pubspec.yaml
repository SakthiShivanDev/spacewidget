name: spacewidget_studio_preview
publish_to: none
version: 0.3.0
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  spacewidget:
    path: ../..
  spacewidget_adapters:
    path: ../../packages/spacewidget_adapters
  web: ^1.1.1
  cupertino_icons: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: StudioSans
      fonts:
        - asset: assets/fonts/StudioSans-Regular.ttf
        - asset: assets/fonts/StudioSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/StudioSans-Bold.ttf
          weight: 700
